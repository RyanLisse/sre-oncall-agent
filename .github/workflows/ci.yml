name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm run diagrams
      - run: git diff --exit-code -- fixtures/telemetry   # fixtures are deterministic
      - run: git diff --exit-code -- docs/diagrams/*.svg   # diagrams are generated
      - run: npm run check
      - name: Demo smoke
        run: npm run demo
        env:
          BASELINE_S: 10
          FAULT_S: 21
          RECOVER_S: 20
