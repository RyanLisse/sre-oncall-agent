<svg xmlns="http://www.w3.org/2000/svg" width="860" height="985" viewBox="0 0 860 985" role="img" aria-label="The on-call loop: alert → investigation → recovery">
<style>
  text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .h { font-size: 20px; font-weight: 700; fill: #1F1D1A; }
  .lane { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: 2px; fill: #6E675E; text-transform: uppercase; }
  .title { font-size: 17px; font-weight: 700; fill: #1F1D1A; }
  .title.green { fill: #2F6B46; }
  .desc { font-size: 14px; fill: #6E675E; }
  .cap { font-size: 13px; fill: #6E675E; font-style: italic; }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A8378"/></marker></defs>
<rect width="860" height="985" rx="10" fill="#F7F4EE"/>
<text x="430" y="34" text-anchor="middle" class="h">The on-call loop: alert → investigation → recovery</text>
<rect x="24" y="76" width="812" height="255" rx="6" fill="#EFEBE3"/><text x="44" y="208.5" class="lane">ALERT INTAKE</text><rect x="186" y="100" width="190" height="207" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="202" y="132" class="title">Your alerting ·</tspan><tspan x="202" y="154" class="title">or a deployment</tspan><tspan x="202" y="176" class="title">watch</tspan></text><text><tspan x="202" y="206" class="desc">Detects a failure.</tspan><tspan x="202" y="225" class="desc">Page-worthy alerts page</tspan><tspan x="202" y="244" class="desc">a human. The watch has a</tspan><tspan x="202" y="263" class="desc">fixed policy and no</tspan><tspan x="202" y="282" class="desc">rollback.</tspan></text><line x1="380" y1="203.5" x2="404" y2="203.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="100" width="190" height="207" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="132" class="title">Queue</tspan></text><text><tspan x="426" y="162" class="desc">Delivers the alert as</tspan><tspan x="426" y="181" class="desc">one JSON incident.</tspan></text><line x1="604" y1="203.5" x2="628" y2="203.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="100" width="190" height="207" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="650" y="132" class="title">Lessons by #tag</tspan></text><text><tspan x="650" y="162" class="desc">Loads only past</tspan><tspan x="650" y="181" class="desc">incidents of this</tspan><tspan x="650" y="200" class="desc">failure class.</tspan></text><line x1="505" y1="335" x2="505" y2="367" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="373" width="812" height="255" rx="6" fill="#EFEBE3"/><text x="44" y="505.5" class="lane">INVESTIGATION</text><rect x="186" y="397" width="190" height="207" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="202" y="429" class="title">Claude Agent SDK</tspan></text><text><tspan x="202" y="459" class="desc">Runs the loop: query()</tspan><tspan x="202" y="478" class="desc">with a system prompt and</tspan><tspan x="202" y="497" class="desc">a loop budget.</tspan></text><line x1="380" y1="500.5" x2="404" y2="500.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="397" width="190" height="207" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="429" class="title">Read-only MCP</tspan><tspan x="426" y="451" class="title">tools</tspan></text><text><tspan x="426" y="481" class="desc">summarize_metrics ·</tspan><tspan x="426" y="500" class="desc">list_deploys · get_diff</tspan><tspan x="426" y="519" class="desc">· search_logs. Nothing</tspan><tspan x="426" y="538" class="desc">writes.</tspan></text><line x1="604" y1="500.5" x2="628" y2="500.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="397" width="190" height="207" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="650" y="429" class="title">Diagnosis</tspan></text><text><tspan x="650" y="459" class="desc">Six lines, every claim</tspan><tspan x="650" y="478" class="desc">cited. One proposal, one</tspan><tspan x="650" y="497" class="desc">owner.</tspan></text><line x1="505" y1="632" x2="505" y2="664" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="670" width="812" height="255" rx="6" fill="#EFEBE3"/><text x="44" y="802.5" class="lane">RECOVERY</text><rect x="186" y="694" width="190" height="207" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="202" y="726" class="title">Named human</tspan></text><text><tspan x="202" y="756" class="desc">Signs or rejects the</tspan><tspan x="202" y="775" class="desc">exact proposal. Nothing</tspan><tspan x="202" y="794" class="desc">else is approved.</tspan></text><line x1="380" y1="797.5" x2="404" y2="797.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="694" width="190" height="207" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="726" class="title">Separate executor</tspan></text><text><tspan x="426" y="756" class="desc">Reads isApproved().</tspan><tspan x="426" y="775" class="desc">Recomputes the target</tspan><tspan x="426" y="794" class="desc">from telemetry. Rolls</tspan><tspan x="426" y="813" class="desc">back, then collects</tspan><tspan x="426" y="832" class="desc">fresh checkout evidence.</tspan></text><line x1="604" y1="797.5" x2="628" y2="797.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="694" width="190" height="207" rx="5" fill="#E6F0E8" stroke="#2F6B46" stroke-width="1.5"/><text><tspan x="650" y="726" class="title green">Watch it land</tspan></text><text><tspan x="650" y="756" class="desc">Three bounded checks on</tspan><tspan x="650" y="775" class="desc">the metric that fired.</tspan><tspan x="650" y="794" class="desc">Only a human closes.</tspan></text>
<text x="430" y="973" text-anchor="middle" class="cap">The agent owns the middle lane only. Detection stays with your alerting; mitigation stays with a human.</text>
</svg>
