<svg xmlns="http://www.w3.org/2000/svg" width="860" height="862" viewBox="0 0 860 862" role="img" aria-label="The on-call loop: alert → investigation → recovery">
<style>
  text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .h { font-size: 20px; font-weight: 700; fill: #1F1D1A; }
  .lane { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: 2px; fill: #6E675E; text-transform: uppercase; }
  .title { font-size: 17px; font-weight: 700; fill: #1F1D1A; }
  .title.green { fill: #2F6B46; }
  .desc { font-size: 14px; fill: #6E675E; }
  .cap { font-size: 13px; fill: #6E675E; font-style: italic; }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A8378"/></marker></defs>
<rect width="860" height="862" rx="10" fill="#F7F4EE"/>
<text x="430" y="34" text-anchor="middle" class="h">The on-call loop: alert → investigation → recovery</text>
<rect x="24" y="76" width="812" height="214" rx="6" fill="#EFEBE3"/><text x="44" y="188" class="lane">ALERT INTAKE</text><rect x="186" y="100" width="190" height="166" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="202" y="132" class="title">Your alerting</tspan></text><text><tspan x="202" y="162" class="desc">Detects a failure.</tspan><tspan x="202" y="181" class="desc">Page-worthy alerts page</tspan><tspan x="202" y="200" class="desc">a human directly.</tspan></text><line x1="380" y1="183" x2="404" y2="183" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="100" width="190" height="166" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="132" class="title">Queue</tspan></text><text><tspan x="426" y="162" class="desc">Delivers the alert as</tspan><tspan x="426" y="181" class="desc">one JSON incident.</tspan></text><line x1="604" y1="183" x2="628" y2="183" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="100" width="190" height="166" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="650" y="132" class="title">Lessons by #tag</tspan></text><text><tspan x="650" y="162" class="desc">Loads only past</tspan><tspan x="650" y="181" class="desc">incidents of this</tspan><tspan x="650" y="200" class="desc">failure class.</tspan></text><line x1="505" y1="294" x2="505" y2="326" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="332" width="812" height="214" rx="6" fill="#EFEBE3"/><text x="44" y="444" class="lane">INVESTIGATION</text><rect x="186" y="356" width="190" height="166" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="202" y="388" class="title">Claude Agent SDK</tspan></text><text><tspan x="202" y="418" class="desc">Runs the loop: query()</tspan><tspan x="202" y="437" class="desc">with a system prompt and</tspan><tspan x="202" y="456" class="desc">a loop budget.</tspan></text><line x1="380" y1="439" x2="404" y2="439" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="356" width="190" height="166" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="388" class="title">Read-only MCP</tspan><tspan x="426" y="410" class="title">tools</tspan></text><text><tspan x="426" y="440" class="desc">summarize_metrics ·</tspan><tspan x="426" y="459" class="desc">list_deploys ·</tspan><tspan x="426" y="478" class="desc">search_logs. Nothing</tspan><tspan x="426" y="497" class="desc">writes.</tspan></text><line x1="604" y1="439" x2="628" y2="439" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="356" width="190" height="166" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="650" y="388" class="title">Diagnosis</tspan></text><text><tspan x="650" y="418" class="desc">Six lines, every claim</tspan><tspan x="650" y="437" class="desc">cited. One proposal, one</tspan><tspan x="650" y="456" class="desc">owner.</tspan></text><line x1="505" y1="550" x2="505" y2="582" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="588" width="812" height="214" rx="6" fill="#EFEBE3"/><text x="44" y="700" class="lane">RECOVERY</text><rect x="186" y="612" width="190" height="166" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="202" y="644" class="title">Named human</tspan></text><text><tspan x="202" y="674" class="desc">Signs or rejects the</tspan><tspan x="202" y="693" class="desc">exact proposal. Nothing</tspan><tspan x="202" y="712" class="desc">else is approved.</tspan></text><line x1="380" y1="695" x2="404" y2="695" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="612" width="190" height="166" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="644" class="title">Separate executor</tspan></text><text><tspan x="426" y="674" class="desc">Reads isApproved().</tspan><tspan x="426" y="693" class="desc">Applies the permitted</tspan><tspan x="426" y="712" class="desc">change. Not this repo.</tspan></text><line x1="604" y1="695" x2="628" y2="695" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="612" width="190" height="166" rx="5" fill="#E6F0E8" stroke="#2F6B46" stroke-width="1.5"/><text><tspan x="650" y="644" class="title green">Watch it land</tspan></text><text><tspan x="650" y="674" class="desc">Three bounded checks on</tspan><tspan x="650" y="693" class="desc">the metric that fired.</tspan><tspan x="650" y="712" class="desc">Only a human closes.</tspan></text>
<text x="430" y="850" text-anchor="middle" class="cap">The agent owns the middle lane only. Detection stays with your alerting; mitigation stays with a human.</text>
</svg>
