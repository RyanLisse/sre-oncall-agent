<svg xmlns="http://www.w3.org/2000/svg" width="860" height="919" viewBox="0 0 860 919" role="img" aria-label="The model proposes. Code checks.">
<style>
  text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .h { font-size: 20px; font-weight: 700; fill: #1F1D1A; }
  .lane { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: 2px; fill: #6E675E; text-transform: uppercase; }
  .title { font-size: 17px; font-weight: 700; fill: #1F1D1A; }
  .title.green { fill: #2F6B46; }
  .desc { font-size: 14px; fill: #6E675E; }
  .cap { font-size: 13px; fill: #6E675E; font-style: italic; }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A8378"/></marker></defs>
<rect width="860" height="919" rx="10" fill="#F7F4EE"/>
<text x="430" y="34" text-anchor="middle" class="h">The model proposes. Code checks.</text>
<rect x="24" y="76" width="812" height="233" rx="6" fill="#EFEBE3"/><text x="44" y="197.5" class="lane">MODEL</text><rect x="186" y="100" width="190" height="185" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="202" y="132" class="title">Structured</tspan><tspan x="202" y="154" class="title">verdict</tspan></text><text><tspan x="202" y="184" class="desc">outputFormat:</tspan><tspan x="202" y="203" class="desc">json_schema. tag ·</tspan><tspan x="202" y="222" class="desc">severity · confidence ·</tspan><tspan x="202" y="241" class="desc">hypothesis · evidence[]</tspan><tspan x="202" y="260" class="desc">· proposal</tspan></text><line x1="505" y1="313" x2="505" y2="345" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="351" width="812" height="233" rx="6" fill="#EFEBE3"/><text x="44" y="472.5" class="lane">CONTRACT</text><rect x="186" y="375" width="190" height="185" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="202" y="407" class="title">Shape</tspan></text><text><tspan x="202" y="437" class="desc">parseVerdict: known</tspan><tspan x="202" y="456" class="desc">fields only, draft_only</tspan><tspan x="202" y="475" class="desc">and</tspan><tspan x="202" y="494" class="desc">human_approval_required</tspan><tspan x="202" y="513" class="desc">are literally true.</tspan></text><line x1="380" y1="467.5" x2="404" y2="467.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="375" width="190" height="185" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="407" class="title">Evidence rules</tspan></text><text><tspan x="426" y="437" class="desc">Strong proposal → 2</tspan><tspan x="426" y="456" class="desc">sources. rollback → a</tspan><tspan x="426" y="475" class="desc">deploys line. low</tspan><tspan x="426" y="494" class="desc">confidence →</tspan><tspan x="426" y="513" class="desc">investigate-more only.</tspan></text><line x1="604" y1="467.5" x2="628" y2="467.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="375" width="190" height="185" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="650" y="407" class="title">Trace</tspan></text><text><tspan x="650" y="437" class="desc">checkTrace: a cited</tspan><tspan x="650" y="456" class="desc">source whose tool was</tspan><tspan x="650" y="475" class="desc">never called fails.</tspan><tspan x="650" y="494" class="desc">metrics and deploys must</tspan><tspan x="650" y="513" class="desc">be called.</tspan></text><line x1="505" y1="588" x2="505" y2="620" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="626" width="812" height="233" rx="6" fill="#EFEBE3"/><text x="44" y="747.5" class="lane">HUMAN</text><rect x="186" y="650" width="190" height="185" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="202" y="682" class="title">Diagnosis</tspan></text><text><tspan x="202" y="712" class="desc">What's happening · Root</tspan><tspan x="202" y="731" class="desc">cause · Blast radius ·</tspan><tspan x="202" y="750" class="desc">Proposed fix · Ruled out</tspan><tspan x="202" y="769" class="desc">· Would change my mind</tspan></text><line x1="380" y1="742.5" x2="404" y2="742.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="650" width="190" height="185" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="426" y="682" class="title">Approval record</tspan></text><text><tspan x="426" y="712" class="desc">pending → approved |</tspan><tspan x="426" y="731" class="desc">rejected, by a named</tspan><tspan x="426" y="750" class="desc">human, for one incident</tspan><tspan x="426" y="769" class="desc">and one proposal.</tspan></text><line x1="604" y1="742.5" x2="628" y2="742.5" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="650" width="190" height="185" rx="5" fill="#E6F0E8" stroke="#2F6B46" stroke-width="1.5"/><text><tspan x="650" y="682" class="title green">Decision</tspan></text><text><tspan x="650" y="712" class="desc">A person decides what to</tspan><tspan x="650" y="731" class="desc">mitigate and when.</tspan></text>
<text x="430" y="907" text-anchor="middle" class="cap">Any failure shows the human FAIL contract and the raw model text. Nothing is silently repaired or routed.</text>
</svg>
