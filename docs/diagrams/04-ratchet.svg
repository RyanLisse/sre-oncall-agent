<svg xmlns="http://www.w3.org/2000/svg" width="860" height="562" viewBox="0 0 860 562" role="img" aria-label="The bench and the ratchet: a floor that only goes up">
<style>
  text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .h { font-size: 20px; font-weight: 700; fill: #1F1D1A; }
  .lane { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: 2px; fill: #6E675E; text-transform: uppercase; }
  .title { font-size: 17px; font-weight: 700; fill: #1F1D1A; }
  .title.green { fill: #2F6B46; }
  .desc { font-size: 14px; fill: #6E675E; }
  .cap { font-size: 13px; fill: #6E675E; font-style: italic; }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A8378"/></marker></defs>
<rect width="860" height="562" rx="10" fill="#F7F4EE"/>
<text x="430" y="34" text-anchor="middle" class="h">The bench and the ratchet: a floor that only goes up</text>
<rect x="24" y="76" width="812" height="192" rx="6" fill="#EFEBE3"/><text x="44" y="177" class="lane">REPLAY</text><rect x="186" y="100" width="190" height="144" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="202" y="132" class="title">bench/cases.json</tspan></text><text><tspan x="202" y="162" class="desc">Held-out incidents with</tspan><tspan x="202" y="181" class="desc">the expected proposal</tspan><tspan x="202" y="200" class="desc">and severity.</tspan></text><line x1="380" y1="172" x2="404" y2="172" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="100" width="190" height="144" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="132" class="title">offlineVerdict</tspan></text><text><tspan x="426" y="162" class="desc">Each case is</tspan><tspan x="426" y="181" class="desc">investigated with the</tspan><tspan x="426" y="200" class="desc">same tools and the same</tspan><tspan x="426" y="219" class="desc">fixture.</tspan></text><line x1="604" y1="172" x2="628" y2="172" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="100" width="190" height="144" rx="5" fill="#FDEEE9" stroke="#D94F30" stroke-width="1.5"/><text><tspan x="650" y="132" class="title">Grade</tspan></text><text><tspan x="650" y="162" class="desc">pass · partial · fail ·</tspan><tspan x="650" y="181" class="desc">harmful — harmful = a</tspan><tspan x="650" y="200" class="desc">strong action the key</tspan><tspan x="650" y="219" class="desc">says is wrong.</tspan></text><line x1="505" y1="272" x2="505" y2="304" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="310" width="812" height="192" rx="6" fill="#EFEBE3"/><text x="44" y="411" class="lane">GATE</text><rect x="186" y="334" width="190" height="144" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="202" y="366" class="title">bench/ratchet.json</tspan></text><text><tspan x="202" y="396" class="desc">min_rate ≥ 0.70,</tspan><tspan x="202" y="415" class="desc">max_harmful = 0. CI</tspan><tspan x="202" y="434" class="desc">fails below the floor.</tspan></text><line x1="380" y1="406" x2="404" y2="406" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="334" width="190" height="144" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="426" y="366" class="title">--raise</tspan></text><text><tspan x="426" y="396" class="desc">When the score improves,</tspan><tspan x="426" y="415" class="desc">the floor moves up. It</tspan><tspan x="426" y="434" class="desc">is never lowered by</tspan><tspan x="426" y="453" class="desc">hand.</tspan></text><line x1="604" y1="406" x2="628" y2="406" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="334" width="190" height="144" rx="5" fill="#E6F0E8" stroke="#2F6B46" stroke-width="1.5"/><text><tspan x="650" y="366" class="title green">Fix the process</tspan></text><text><tspan x="650" y="396" class="desc">A regression means fix</tspan><tspan x="650" y="415" class="desc">the investigator or</tspan><tspan x="650" y="434" class="desc">correct the case, not</tspan><tspan x="650" y="453" class="desc">the number.</tspan></text>
<text x="430" y="550" text-anchor="middle" class="cap">Borrowed from Anthropic's claude.ai performance sprint: every benchmark is also a CI guardrail with a one-way number.</text>
</svg>
