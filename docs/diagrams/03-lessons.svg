<svg xmlns="http://www.w3.org/2000/svg" width="860" height="562" viewBox="0 0 860 562" role="img" aria-label="The lessons loop: no unreviewed memory">
<style>
  text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .h { font-size: 20px; font-weight: 700; fill: #1F1D1A; }
  .lane { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: 2px; fill: #6E675E; text-transform: uppercase; }
  .title { font-size: 17px; font-weight: 700; fill: #1F1D1A; }
  .title.green { fill: #2F6B46; }
  .desc { font-size: 14px; fill: #6E675E; }
  .cap { font-size: 13px; fill: #6E675E; font-style: italic; }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A8378"/></marker></defs>
<rect width="860" height="562" rx="10" fill="#F7F4EE"/>
<text x="430" y="34" text-anchor="middle" class="h">The lessons loop: no unreviewed memory</text>
<rect x="24" y="76" width="812" height="192" rx="6" fill="#EFEBE3"/><text x="44" y="177" class="lane">READ</text><rect x="186" y="100" width="190" height="144" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="202" y="132" class="title">guessTag(alert)</tspan></text><text><tspan x="202" y="162" class="desc">#bad-deploy · #latency ·</tspan><tspan x="202" y="181" class="desc">#errors · #noise from</tspan><tspan x="202" y="200" class="desc">the alert text.</tspan></text><line x1="380" y1="172" x2="404" y2="172" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="100" width="190" height="144" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="132" class="title">entriesForTag</tspan></text><text><tspan x="426" y="162" class="desc">Only matching entries go</tspan><tspan x="426" y="181" class="desc">into the prompt. The</tspan><tspan x="426" y="200" class="desc">whole file is never</tspan><tspan x="426" y="219" class="desc">read.</tspan></text><line x1="604" y1="172" x2="628" y2="172" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="100" width="190" height="144" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="650" y="132" class="title">First hypothesis</tspan></text><text><tspan x="650" y="162" class="desc">A matching past incident</tspan><tspan x="650" y="181" class="desc">is the cheapest to</tspan><tspan x="650" y="200" class="desc">confirm or kill.</tspan></text><line x1="505" y1="272" x2="505" y2="304" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="24" y="310" width="812" height="192" rx="6" fill="#EFEBE3"/><text x="44" y="411" class="lane">WRITE</text><rect x="186" y="334" width="190" height="144" rx="5" fill="#F3EBE2" stroke="#8C6A4A" stroke-width="1.5"/><text><tspan x="202" y="366" class="title">Proposed lesson</tspan></text><text><tspan x="202" y="396" class="desc">lessons/proposed/&lt;id&gt;.md:</tspan><tspan x="202" y="415" class="desc">what happened · root</tspan><tspan x="202" y="434" class="desc">cause · fix OPEN ·</tspan><tspan x="202" y="453" class="desc">gotcha OPEN</tspan></text><line x1="380" y1="406" x2="404" y2="406" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="410" y="334" width="190" height="144" rx="5" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1"/><text><tspan x="426" y="366" class="title">Human review</tspan></text><text><tspan x="426" y="396" class="desc">Fills in fix and gotcha.</tspan><tspan x="426" y="415" class="desc">Moves the entry into</tspan><tspan x="426" y="434" class="desc">lessons.md by PR.</tspan></text><line x1="604" y1="406" x2="628" y2="406" stroke="#8A8378" stroke-width="1.4" marker-end="url(#arr)"/><rect x="634" y="334" width="190" height="144" rx="5" fill="#E6F0E8" stroke="#2F6B46" stroke-width="1.5"/><text><tspan x="650" y="366" class="title green">Promotion</tspan></text><text><tspan x="650" y="396" class="desc">promotionCandidates():</tspan><tspan x="650" y="415" class="desc">≥3 entries on a tag →</tspan><tspan x="650" y="434" class="desc">references/&lt;tag&gt;.md</tspan></text>
<text x="430" y="550" text-anchor="middle" class="cap">The agent reads what a human reviewed and writes only proposals. Three entries on one tag → a playbook, not a log.</text>
</svg>
