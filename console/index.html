<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>on-call · console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#fff; --side:#fafaf9; --line:#e7e5e4; --text:#1c1917; --muted:#78716c; --accent:#1c1917; --ok:#2f6b46; --okbg:#eef6f0; --warn:#b45309; --warnbg:#fff7ed; --bad:#b91c1c; --badbg:#fef2f2; --card:#fff; --agent:#f5f5f4; }
  * { box-sizing:border-box } html,body { height:100%; } body { margin:0; font:15px/1.5 -apple-system,"Segoe UI",Inter,sans-serif; color:var(--text); background:var(--bg); display:grid; grid-template-columns:280px 1fr; grid-template-rows:100vh; min-height:100vh; }
  aside { background:var(--side); border-right:1px solid var(--line); padding:20px 16px; display:flex; flex-direction:column; gap:14px; overflow:auto }
  .logo { font-weight:700; font-size:18px; display:flex; gap:8px; align-items:center } .logo span{color:var(--muted)}
  .nav a { display:block; padding:8px 10px; border-radius:8px; color:var(--text); text-decoration:none } .nav a.active{background:#fff;border:1px solid var(--line)}
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer } .btn:hover{background:#f5f5f4} .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.ok{color:var(--ok);border-color:#bfd8c6} .btn.bad{color:var(--bad);border-color:#f3c3c3} .btn:disabled{opacity:.45;cursor:not-allowed}
  .sect { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; margin-top:8px } .pill{background:#e7e5e4;border-radius:10px;padding:0 8px;font-size:12px}
  .inc { padding:8px 10px; border-radius:8px; cursor:pointer; display:flex; gap:10px; align-items:flex-start } .inc:hover{background:#f0efed} .inc.sel{background:#fff;border:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none} .dot.active{background:var(--bad)} .dot.stale{background:var(--warn)} .dot.mitigated{background:#2563eb} .dot.resolved{background:var(--ok)}
  .inc .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .inc .d{font-size:12px;color:var(--muted)}
  .listen { margin-top:auto; font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center } .listen i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
  main { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100vh; min-height:0; }
  header { padding:18px 32px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px } header b{color:var(--text)}
  .body { overflow:auto; padding:28px 32px; min-height:0; }
  .empty { max-width:640px; margin:12vh auto; } .empty h1{font-size:28px;margin:0 0 6px} .empty p{color:var(--muted);margin:0 0 22px}
  .sugg { display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px; padding:14px 16px; margin:10px 0; font:inherit; cursor:pointer } .sugg:hover{background:#f5f5f4}
  .ov h1{font-size:28px;margin:0} .ov .sub{color:var(--muted);margin:4px 0 22px}
  .banner{border-radius:12px;padding:18px 22px;display:flex;gap:14px;align-items:center;margin-bottom:18px} .banner.ok{background:var(--okbg);color:var(--ok)} .banner.bad{background:var(--badbg);color:var(--bad)} .banner h3{margin:0;font-size:18px} .banner p{margin:2px 0 0;font-size:14px;opacity:.85}
  .row{display:flex;justify-content:space-between;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer} .row:hover{background:#fafaf9} .row .st{font-size:13px;color:var(--muted)}
  .msgs{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .msg{padding:12px 16px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-break:break-word;font-size:14px} .msg.user{align-self:flex-end;background:var(--accent);color:#fff} .msg.agent{background:var(--agent)} .msg.system{color:var(--muted);font-size:13px;background:transparent;padding:4px 16px} .msg.tool{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);background:transparent;padding:2px 16px} .msg.error{background:var(--badbg);color:var(--bad)} .msg.watch{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#fafaf9;border:1px solid var(--line)} .msg.executor{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#1e40af;background:#eff6ff}
  .diag{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:100%} .diag h4{margin:0 0 10px;display:flex;gap:10px;align-items:center;font-size:15px} .tag{background:#e7e5e4;border-radius:6px;padding:1px 8px;font-size:12px;font-family:ui-monospace,Menlo,monospace} .sev.page{background:var(--badbg);color:var(--bad)} .sev.morning-log{background:#f5f5f4;color:var(--muted)}
  .diag dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:0;font-size:14px} .diag dt{color:var(--muted)} .diag dd{margin:0} .diag li{margin:2px 0} .diag ul{margin:0;padding-left:18px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center} .actions input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;width:140px}
  .appr{border-radius:10px;padding:10px 14px;font-size:13px;border:1px solid var(--line)} .appr.pending{background:var(--warnbg);color:var(--warn)} .appr.approved{background:var(--okbg);color:var(--ok)} .appr.rejected{background:var(--badbg);color:var(--bad)}
  footer{padding:14px 32px 22px} .box{max-width:900px;margin:0 auto;border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .box textarea{border:0;outline:0;resize:none;font:inherit;width:100%;min-height:44px} .box .bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)} .send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;border:0;cursor:pointer;font-size:16px}
  .note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>
<aside>
  <div class="logo">∿ on-call <span id="mode"></span></div>
  <div class="nav"><a href="#" id="navOverview" class="active">▦ Overview</a></div>
  <button class="btn" id="newInv">＋ New investigation</button>
  <div class="sect">Active incidents <span class="pill" id="nActive">0</span></div>
  <div id="activeList"></div>
  <div class="sect">History <span class="pill" id="nHist">0</span></div>
  <div id="histList"></div>
  <div class="listen"><i></i> <span id="listen">Listening for alerts</span></div>
</aside>
<main>
  <header><div>Operations / <b id="crumb">Overview</b></div><div>🤖 On-call agent · <span id="health">…</span></div></header>
  <div class="body" id="body"></div>
  <footer>
    <div class="box">
      <textarea id="input" placeholder="Ask a question, watch a deployment or request an investigation…"></textarea>
      <div class="bar"><span>Enter to send · Shift+Enter for newline · rollbacks and approvals are buttons, not chat</span><button class="send" id="send">↑</button></div>
    </div>
  </footer>
</main>
<script>
const $ = (s) => document.querySelector(s);
let incidents = [], sel = null, msgs = [];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (iso) => new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const api = (p, b) => fetch("/api" + p, b ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) } : {}).then((r) => r.json());

async function health() { const h = await api("/health"); $("#health").textContent = `${h.model} · shop ${h.shop ? h.shop.revision + " " + h.shop.mode : "offline"} · ${h.telemetry ? h.telemetry.buckets + " buckets" : "no telemetry"}`; $("#mode").textContent = h.model === "offline" ? "offline" : h.model; }

function renderSidebar() {
  const act = incidents.filter((i) => i.state === "active" || i.state === "stale" || i.state === "mitigated"), hist = incidents.filter((i) => i.state === "resolved");
  $("#nActive").textContent = act.length; $("#nHist").textContent = hist.length;
  const item = (i) => `<div class="inc ${sel === i.id ? "sel" : ""}" data-id="${i.id}"><span class="dot ${i.state}"></span><div><div class="t" title="${esc(i.title)}">${esc(i.title)}</div><div class="d">${fmt(i.updated_at)} · ${i.source} · ${i.state}</div></div></div>`;
  $("#activeList").innerHTML = act.map(item).join("") || `<div class="d" style="color:var(--muted);font-size:13px;padding:4px 10px">No active incidents.</div>`;
  $("#histList").innerHTML = hist.map(item).join("");
  document.querySelectorAll(".inc").forEach((el) => el.onclick = () => open(el.dataset.id));
  $("#navOverview").classList.toggle("active", sel === null);
}

function renderOverview() {
  $("#crumb").textContent = "Overview";
  const act = incidents.filter((i) => i.state !== "resolved");
  const banner = act.length ? `<div class="banner bad">⚠ <div><h3>${act.length} incident${act.length > 1 ? "s" : ""} need${act.length > 1 ? "" : "s"} a human</h3><p>Open one to read the diagnosis and decide.</p></div></div>` : `<div class="banner ok">✓ <div><h3>No active incidents</h3><p>New alerts will appear here for investigation.</p></div></div>`;
  $("#body").innerHTML = `<div class="ov"><h1>Production overview</h1><p class="sub">Your incidents, investigations and recovery actions.</p>${banner}<h3>Recent history</h3>${incidents.slice(0, 12).map((i) => `<div class="row" data-id="${i.id}"><div><b>${esc(i.title)}</b><div class="st">${fmt(i.created_at)} · ${i.source}</div></div><span class="st">${i.state === "resolved" ? "✓ Resolved" : i.state}</span></div>`).join("") || `<p class="st">Nothing yet. Post an alert, start a watch, or ask the agent.</p>`}<p class="note">Incident status reflects recorded investigations. It is not an uptime measurement.</p></div>`;
  document.querySelectorAll(".row").forEach((el) => el.onclick = () => open(el.dataset.id));
}

function renderDiag(v, approval, inc) {
  const ev = (v.evidence || []).map((e) => `<li><code>${esc(e.source)}:${esc(e.ref)}</code> — ${esc(e.note)}</li>`).join("");
  const a = approval ? `<div class="appr ${approval.decision}">${approval.decision === "pending" ? "⏳ Pending: a named human must approve or reject this exact proposal." : `${approval.decision === "approved" ? "✓ Approved" : "✗ Rejected"} by ${esc(approval.decided_by)} · ${fmt(approval.decided_at)}`}</div>` : "";
  const canAct = approval && approval.decision === "pending" && inc.state !== "resolved";
  return `<div class="diag"><h4><span class="tag">#${esc(v.tag)}</span><span class="tag sev ${v.severity}">${v.severity}</span><span class="tag">confidence ${v.confidence}</span></h4>
  <dl><dt>What's happening</dt><dd>${esc(v.hypothesis)}</dd><dt>Root cause</dt><dd><ul>${ev}</ul></dd><dt>Blast radius</dt><dd>${esc(v.blast_radius)}</dd><dt>Proposed fix</dt><dd><b>${esc(v.proposal)}</b> — watch <code>${esc(v.watch_metric)}</code> afterwards</dd><dt>Ruled out</dt><dd>${(v.ruled_out || []).map(esc).join("<br>") || "(nothing)"}</dd><dt>Would change my mind</dt><dd>${esc(v.would_change_my_mind)}</dd></dl>
  <div class="actions">${a}</div>
  <div class="actions">
    <input id="by" placeholder="your name" value="${esc(localStorage.by || "")}">
    <button class="btn ok" id="approve" ${canAct ? "" : "disabled"}>Approve ${esc(v.proposal)}</button>
    <button class="btn bad" id="reject" ${canAct ? "" : "disabled"}>Reject</button>
    <button class="btn" id="execute" ${approval && approval.decision === "approved" && v.proposal === "rollback" ? "" : "disabled"} title="separate executor: recomputes target from telemetry, rolls back, collects fresh evidence">Execute rollback</button>
    <button class="btn" id="mitigated" ${inc.state === "resolved" ? "disabled" : ""}>Mark mitigated</button>
    <button class="btn primary" id="resolve" ${inc.state === "resolved" ? "disabled" : ""}>Resolve (human)</button>
  </div></div>`;
}

function renderIncident() {
  const inc = incidents.find((i) => i.id === sel); if (!inc) return renderOverview();
  $("#crumb").textContent = `${inc.id} · ${inc.title}`;
  let lastDiag = null, lastAppr = null;
  for (const m of msgs) { if (m.kind === "diagnosis") lastDiag = JSON.parse(m.text); if (m.kind === "approval") lastAppr = JSON.parse(m.text); }
  const html = msgs.map((m) => {
    if (m.kind === "diagnosis") return renderDiag(JSON.parse(m.text), lastAppr, inc);
    if (m.kind === "approval") return "";
    return `<div class="msg ${m.kind === "text" ? m.role : m.kind}">${esc(m.text)}</div>`;
  }).join("");
  $("#body").innerHTML = `<div class="msgs">${html || `<div class="empty"><h1>What needs a closer look?</h1><p>New alerts arrive here automatically. You can also ask the agent to investigate.</p><button class="sugg" data-q="How is production doing?">How is production doing? ↗</button><button class="sugg" data-q="Watch the next deployment for five minutes.">Watch the next deployment for five minutes. ↗</button><button class="sugg" data-q="Investigate: customers report checkout errors">Investigate: customers report checkout errors ↗</button></div>`}</div>`;
  document.querySelectorAll(".sugg").forEach((b) => b.onclick = () => send(b.dataset.q));
  const by = () => { const v = $("#by")?.value.trim() || ""; localStorage.by = v; return v; };
  $("#approve") && ($("#approve").onclick = async () => { const r = await api(`/incidents/${sel}/approve`, { by: by() }); if (r.error) alert(r.error); });
  $("#reject") && ($("#reject").onclick = async () => { const r = await api(`/incidents/${sel}/reject`, { by: by() }); if (r.error) alert(r.error); });
  $("#execute") && ($("#execute").onclick = () => api(`/incidents/${sel}/execute`, {}));
  $("#mitigated") && ($("#mitigated").onclick = async () => { const r = await api(`/incidents/${sel}/state`, { state: "mitigated", by: by() }); if (r.error) alert(r.error); });
  $("#resolve") && ($("#resolve").onclick = async () => { const r = await api(`/incidents/${sel}/state`, { state: "resolved", by: by() }); if (r.error) alert(r.error); });
  $("#body").scrollTop = $("#body").scrollHeight;
}

async function open(id) { sel = id; const r = await api(`/incidents/${id}`); msgs = r.messages; renderSidebar(); renderIncident(); }
async function send(text) {
  text = (text ?? $("#input").value).trim(); if (!text) return; $("#input").value = "";
  if (!sel) { const row = await api("/incidents", { title: text, investigate: false }); sel = row.id; msgs = []; }
  await api(`/incidents/${sel}/chat`, { text });
}
$("#send").onclick = () => send(); $("#input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("#newInv").onclick = () => { sel = null; msgs = []; renderSidebar(); $("#crumb").textContent = "Investigation"; $("#body").innerHTML = `<div class="empty"><h1>What needs a closer look?</h1><p>New alerts arrive here automatically. You can also ask the agent to investigate.</p><button class="sugg" data-q="How is production doing?">How is production doing? ↗</button><button class="sugg" data-q="Watch the next deployment for five minutes.">Watch the next deployment for five minutes. ↗</button><button class="sugg" data-q="Investigate: customers report checkout errors">Investigate: customers report checkout errors ↗</button></div>`; document.querySelectorAll(".sugg").forEach((b) => b.onclick = () => send(b.dataset.q)); };
$("#navOverview").onclick = (e) => { e.preventDefault(); sel = null; renderSidebar(); renderOverview(); };

const params = new URLSearchParams(location.search);
if (params.get("static")) {
  // docs screenshots: one fetch, no open stream (headless Chrome --screenshot waits for network idle)
  api("/incidents").then(async (l) => { incidents = l; renderSidebar(); const id = params.get("incident"); if (id) await open(id); else renderOverview(); });
} else {
  const es = new EventSource("/api/stream");
  es.addEventListener("incidents", (e) => { incidents = JSON.parse(e.data); renderSidebar(); if (sel === null) renderOverview(); else renderIncident(); });
  es.addEventListener("message", (e) => { const m = JSON.parse(e.data); if (m.incident_id === sel) { msgs.push(m); renderIncident(); } });
  setInterval(health, 10000);
}
health();
</script>
</body>
</html>
